name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      # Playwright browser binaries aren't on pip — they live in
      # ~/.cache/ms-playwright. `playwright install --with-deps`
      # also pulls Linux system libs (libnss3, etc.) needed by
      # Chromium on the Ubuntu runner.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run in-process pytest suite
        run: pytest -v -W error::DeprecationWarning --ignore=tests/e2e

      - name: Run Playwright e2e suite
        run: pytest -v tests/e2e --browser chromium
